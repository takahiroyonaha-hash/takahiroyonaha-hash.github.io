<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あおちゃんの ひらがな</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd9e8">
<meta name="apple-mobile-web-app-title" content="ひらがな">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23ffd9e8'/%3E%3Ctext x='90' y='128' font-size='110' text-anchor='middle' fill='%23e0407a' font-family='sans-serif'%3E%E3%81%82%3C/text%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --pink:#ff7fae; --pink-d:#e0407a; --yellow:#ffd166; --mint:#7fd8c4;
    --sky:#8fc9ff; --purple:#c9a7ff; --ink:#4a3b45; --paper:#fffaf3;
    /* 薄いグレーの二次テキストは明るい地の上で 2〜3:1 しか出ない。読める濃さを決めておく */
    --ink-2:#6f626a;
    /* 動きはこの1本だけを使う。外から素早く入って、静かに止まる */
    --ease:cubic-bezier(.16,1,.3,1);
    --pad-b:env(safe-area-inset-bottom,0px);
  }
  /* 4歳が見る画面なので、端末のダークモードでも明るい配色のまま固定する */
  :root{color-scheme:light}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",-apple-system,"Rounded Mplus 1c","Yu Gothic",sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,#fff2f7 0%,#f3f9ff 55%,#f2fff9 100%);
    -webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  #app{
    /* カードの送りアニメーションが一瞬だけ画面幅からはみ出すので、外へ出さない */
    position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 12px calc(var(--pad-b) + 8px);
    max-width:520px;margin:0 auto;
  }
  /* ---- 共通ヘッダー ---- */
  header{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:52px}
  .hbtn{
    width:52px;height:52px;flex:0 0 auto;border:none;border-radius:18px;
    background:#fff;box-shadow:0 3px 0 #e6dbe2;font-size:26px;line-height:1;
    display:grid;place-items:center;color:var(--pink-d);
  }
  .htitle{flex:1;text-align:center;font-size:20px;font-weight:700;letter-spacing:.04em}
  .stars{
    flex:0 0 auto;background:#fff;border-radius:16px;padding:8px 12px;
    font-size:17px;font-weight:700;box-shadow:0 3px 0 #e6dbe2;white-space:nowrap;
  }
  /* ---- 画面 ---- */
  .screen{flex:1;min-height:0;display:none;flex-direction:column;padding-top:8px}
  .screen.on{display:flex}
  /* ---- ホーム ---- */
  .hero{text-align:center;flex:0 0 auto;margin:2vh 0 2.5vh}
  .hero .name{font-size:clamp(30px,10vw,44px);font-weight:800;color:var(--pink-d);line-height:1.15}
  .hero .sub{font-size:15px;color:var(--ink-2);margin-top:6px}
  .novoice{
    font-size:12px;line-height:1.5;margin:10px auto 0;max-width:320px;padding:8px 10px;
    background:#fff6d6;border-radius:14px;color:#7a5a10;
  }
  .novoice[hidden]{display:none}
  .menu{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;min-height:0}
  .big{
    border:none;border-radius:26px;font-weight:800;
    display:flex;align-items:center;gap:14px;padding:0 18px;
    font-size:clamp(21px,6.4vw,27px);height:clamp(76px,15vh,116px);
    box-shadow:0 6px 0 var(--sh);text-align:left;
  }
  .big .ic{font-size:1.5em;line-height:1}
  .big small{display:block;font-size:13.5px;font-weight:700;opacity:.88;margin-top:3px}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
  /* パステルの上の白ヌキ文字は 1.4〜2.6:1 しか出ず、4歳には読みにくい。
     もともと読めていたのは濃い茶文字の黄色ボタンだけだったので、4色ともその方式に揃える。
     地を明るくして文字を同系色の濃いインクにすると、キャンディ感はむしろ強くなる */
  .b1{background:linear-gradient(135deg,#ffc9de,#ffb0cd);color:#8e1c48;--sh:#f39ab8}
  .b2{background:linear-gradient(135deg,#cfe8ff,#a9d3ff);color:#0f4c84;--sh:#8fbde8}
  .b3{background:linear-gradient(135deg,#ffe7a6,#ffce62);color:#6b4a10;--sh:#eab544}
  .b4{background:linear-gradient(135deg,#c6f0e0,#94ddc3);color:#0b5c46;--sh:#79c4a8}
  /* ---- 行えらび ---- */
  .rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
    grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 2px 12px;align-content:start}
  .rowbtn{
    border:none;border-radius:22px;background:#fff;box-shadow:0 4px 0 var(--sh,#e6dbe2);
    padding:12px 8px;min-height:86px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;color:var(--ink);
  }
  /* 5文字の行名は 320px 幅だとタイルからはみ出す */
  .rowbtn .chars{font-size:clamp(21px,6.8vw,26px);font-weight:800;letter-spacing:.06em;color:var(--pink-d);white-space:nowrap}
  /* 「0 / 5」の算用数字は4歳には読めない。●で残りを見せる */
  .rowbtn .prog{display:flex;gap:5px;align-items:center;justify-content:center;min-height:11px}
  .rowbtn .prog i{width:10px;height:10px;border-radius:50%;background:#eddfe7}
  .rowbtn .prog i.on{background:var(--pink-d)}
  .rowbtn.done .prog i{background:#f0deb0}
  .rowbtn.special .prog i{background:#f5c6da}
  .rowbtn.word .prog i{background:#f0d3ae}
  .rowbtn .prog .lbl{font-size:12.5px;font-weight:700;color:#8e1c48}
  .rowbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh,#e6dbe2)}
  /* 自分の名前の行は、この画面で一番目立っていてほしい */
  .rowbtn.special{background:linear-gradient(135deg,#ffe7f0,#ffd2e3);--sh:#f0b9d0}
  .rowbtn.special .chars{color:#8e1c48}
  .rowbtn.word{background:linear-gradient(135deg,#fff2d9,#ffdcab);--sh:#eac98f}
  .rowbtn.word .chars{color:#8c4707;font-size:clamp(19px,6vw,24px);letter-spacing:.02em}
  .rowbtn.word .prog i.on{background:#8c4707}
  .rowbtn .em{font-size:27px;line-height:1}
  /* 「かく」の行は青、「よむ」の行はピンク。字が読めなくても色でどちらか分かる */
  .rows.trace .rowbtn:not(.word):not(.special) .chars{color:#1a5f9e}
  .rows.trace .rowbtn:not(.word):not(.special) .prog i.on{background:#1a5f9e}
  .rowbtn.done{background:linear-gradient(135deg,#fff6d6,#ffe9a8);--sh:#e6c56f}
  /* ---- カード（よむ） ---- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:14px}
  .card{
    width:100%;background:#fff;border-radius:32px;box-shadow:0 8px 0 #ecdfe6;
    padding:18px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  /* 画面の高さも使って、余白ではなく見せたいものに寸法をまわす */
  .card .ch{font-size:min(46vw,27vh);font-weight:800;line-height:1.02;color:var(--pink-d)}
  .card .emoji{font-size:min(24vw,15vh);line-height:1}
  .card .word{font-size:min(9.5vw,5.4vh);font-weight:700;letter-spacing:.04em}
  .card .word b{color:var(--pink-d)}
  /* 文字と絵はタップで読み上げる。押した手ごたえだけは返す */
  .card .ch,.card .emoji{transition:transform .12s}
  .card .ch:active,.card .emoji:active{transform:scale(.93)}
  .navrow{display:flex;gap:10px;width:100%;align-items:stretch;flex:0 0 auto}
  .nav{
    flex:0 0 22%;border:none;border-radius:22px;background:#fff;box-shadow:0 4px 0 #e6dbe2;
    font-size:28px;color:var(--pink-d);height:70px;
  }
  .nav[disabled]{opacity:.35}
  .speak{
    flex:1;border:none;border-radius:22px;height:70px;font-size:22px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#3488d8,#2b7ac9);box-shadow:0 4px 0 #1c5c9e;
  }
  .speak:active,.nav:active{transform:translateY(3px)}
  .dots{display:flex;gap:8px;justify-content:center;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%;background:#e2d6dd}
  .dot.on{background:var(--pink);transform:scale(1.35)}
  /* ---- なぞりがき ---- */
  .traceWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
  /* vw だと #app の左右パディング分だけはみ出す。親の幅を基準にする */
  .cvBox{position:relative;width:min(100%,400px);aspect-ratio:1/1;flex:0 0 auto}
  #guide,#draw{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
  #guide{background:#fff;box-shadow:0 8px 0 #ecdfe6}
  #draw{touch-action:none}
  .hintrow{display:flex;align-items:center;gap:8px;width:100%;flex:0 0 auto}
  .tracehint{font-size:16px;color:#6b5c64;font-weight:600;text-align:center;min-height:22px;flex:1}
  .mini{
    flex:0 0 auto;border:none;border-radius:16px;padding:9px 12px;font-size:14px;font-weight:800;
    background:#fff;color:#c02f66;box-shadow:0 3px 0 #e6dbe2;white-space:nowrap;
  }
  .mini:active{transform:translateY(2px)}
  .mini[hidden]{display:none}
  /* 書き順はこのアプリで一番教えたいこと。小さな隅のボタンのままにしない */
  #tOrder{
    background:linear-gradient(135deg,#ffe7a6,#ffce62);color:#6b4a10;
    box-shadow:0 3px 0 #eab544;font-size:15px;padding:11px 14px;
  }
  .toolrow{display:flex;gap:10px;width:100%;flex:0 0 auto}
  .tool{
    flex:1;border:none;border-radius:22px;height:66px;font-size:20px;font-weight:800;
    white-space:nowrap;background:#fff;color:var(--ink);box-shadow:0 4px 0 #e6dbe2;
  }
  .tool.go{background:linear-gradient(135deg,#2e9d7f,#1b8068);color:#fff;box-shadow:0 4px 0 #16705b;flex:1.7}
  .tool:active{transform:translateY(3px)}
  /* ---- クイズ ---- */
  .quiz{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .qtop{
    position:relative;background:#fff;border-radius:28px;box-shadow:0 6px 0 #ecdfe6;padding:14px;
    display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;
  }
  .qtop .qem{font-size:min(20vw,13vh);line-height:1}
  .qtop .qtxt{font-size:19px;font-weight:700;color:#5c4d55}
  .qtop .qch{font-size:min(28vw,18vh);font-weight:800;color:var(--pink-d);line-height:1.05}
  /* 「もういちど聞ける」ことが分かる手がかり。押せる形にしておく */
  .replay{
    position:absolute;right:10px;top:10px;border:none;border-radius:50%;padding:0;
    width:42px;height:42px;font-size:19px;background:#eaf4ff;box-shadow:0 3px 0 #cfe3f7;
    display:grid;place-items:center;
  }
  .replay:active{transform:translateY(2px);box-shadow:0 1px 0 #cfe3f7}
  /* きいてえらぶ：スピーカーそのものを大きな丸ボタンにする */
  #qPlay{
    width:min(30vw,116px);aspect-ratio:1/1;border-radius:50%;background:#eaf4ff;
    box-shadow:0 4px 0 #cfe3f7;display:grid;place-items:center;font-size:min(15vw,58px);
  }
  #qPlay:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe3f7}
  .choices{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
  .choice{
    border:none;border-radius:26px;background:#fff;box-shadow:0 6px 0 #e6dbe2;
    font-size:min(26vw,15vh);font-weight:800;color:var(--pink-d);
  }
  /* 絵の選択肢は「絵が答え」なので、カードいっぱいに大きくする */
  .choice.em{font-size:min(28vw,16vh)}
  .choice:active{transform:translateY(3px)}
  .choice.ok{background:linear-gradient(135deg,#c6f0e0,#94ddc3);color:#0b5c46;box-shadow:0 6px 0 #79c4a8}
  .choice.ng{background:#ffdede;color:#9c3535;box-shadow:0 6px 0 #f0b9b9}
  .qbar{display:flex;gap:5px;justify-content:center;flex:0 0 auto}
  .qbar i{width:28px;height:10px;border-radius:5px;background:#e2d6dd}
  .qbar i.now{background:#ffce62}
  .qbar i.hit{background:var(--mint)}
  .qbar i.miss{background:#ffb3b3}
  /* ---- ことばづくり ---- */
  /* スロットとタイルは1つのまとまり。離すと「押す→入る」のつながりが切れる */
  .wplay{flex:0 0 auto;display:flex;flex-direction:column;gap:14px}
  /* 絵・スロット・タイルをひとかたまりとして画面の中央に置く */
  #s-build .quiz{justify-content:center}
  #s-build .qem{font-size:min(40vw,26vh)}
  .wslots{display:flex;gap:10px;justify-content:center;flex:0 0 auto}
  /* 4文字以上のことばは、画面幅からはみ出さないように小さくする */
  .wslots.long{gap:6px}
  .wslots.long .wslot{width:clamp(48px,16vw,72px);font-size:clamp(26px,9vw,40px);border-radius:16px}
  .wslot{
    width:clamp(64px,20vw,88px);aspect-ratio:1/1;border-radius:22px;background:#fffdfe;
    display:grid;place-items:center;font-size:clamp(34px,11vw,48px);font-weight:800;
    color:var(--pink-d);border:3px dashed #f0b9d0;
  }
  .wslot.filled{border-color:transparent;background:#fff;box-shadow:0 5px 0 #ecdfe6}
  .wtiles{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;align-content:center}
  .wtile{
    width:clamp(66px,21vw,92px);aspect-ratio:1/1;border:none;border-radius:24px;background:#fff;
    box-shadow:0 6px 0 #e6dbe2;font-size:clamp(34px,11vw,48px);font-weight:800;color:var(--pink-d);
  }
  .wtile:active{transform:translateY(3px)}
  .wtile.used{visibility:hidden}
  .wtile.bad{animation:shake .35s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)} 40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
  /* ---- ごほうび ---- */
  .rewardScreen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 2px 10px}
  .rcount{text-align:center;font-size:22px;font-weight:800;color:var(--pink-d);margin:6px 0 12px}
  .sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  /* これから手に入るシールも影として見せる。集める気持ちは「残りが見える」ことで生まれる */
  .slot{
    aspect-ratio:1/1;border-radius:18px;background:#ffffffc4;box-shadow:inset 0 0 0 2px #f3e6ee;
    display:grid;place-items:center;font-size:min(8vw,34px);
  }
  .slot:not(.got){filter:grayscale(1);opacity:.28}
  .slot.got{background:#fff;box-shadow:0 4px 0 #ecdfe6}
  .gojuon{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px}
  .gcell{
    aspect-ratio:1/1;border-radius:14px;background:#fff;display:grid;place-items:center;
    font-size:clamp(18px,6vw,26px);font-weight:800;color:#947d89;box-shadow:0 3px 0 #ecdfe6;position:relative;
  }
  .gcell.read{color:var(--pink-d)}
  .gcell.wrote{background:linear-gradient(135deg,#fff6d6,#ffe9a8);box-shadow:0 3px 0 #e6c56f}
  .gcell.wrote::after{content:"⭐️";position:absolute;right:3px;bottom:2px;font-size:11px;line-height:1}
  .gcell.blank{background:transparent;box-shadow:none}
  .gsub{grid-column:1/-1;text-align:center;font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 4px}
  .rsub{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-top:3px}
  .rowbtn.extra{background:linear-gradient(135deg,#f6f0ff,#ece1ff)}
  .rowbtn.extra .chars{color:#7a52c8}
  .legend{text-align:center;font-size:13px;color:#6f606a;font-weight:600;margin-top:12px}
  .credit{text-align:center;font-size:12px;line-height:1.6;color:#71646c;margin-top:18px;padding-bottom:6px}
  .credit a{color:inherit}
  #sndMsg{display:inline-block;font-size:12px;color:var(--ink);margin-top:6px}
  /* ---- お祝いオーバーレイ ---- */
  #cheer{
    position:fixed;inset:0;display:none;place-items:center;z-index:50;
    background:rgba(255,248,251,.82);backdrop-filter:blur(3px);
  }
  #cheer.on{display:grid}
  /* 白い台紙を敷かないと、下の画面と混ざって「ほめられた」感じが消える */
  #cheer .box{
    text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1);
    background:#fff;border-radius:36px;padding:18px 24px 24px;margin:0 18px;
    max-width:340px;box-shadow:0 10px 0 #f0dfe8;
  }
  #cheer .em{font-size:min(26vw,116px);line-height:1.1}
  #cheer .msg{
    font-size:min(7.4vw,32px);font-weight:800;color:var(--pink-d);margin-top:6px;
    line-height:1.35;line-break:strict;word-break:auto-phrase;
  }
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .conf{position:fixed;top:-30px;font-size:22px;z-index:49;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
  /* 4歳には「押した → なにかが動いた」のつながりが要る。
     画面の入り・カードの送り・⭐️が増えた瞬間の3か所だけに絞る */
  @keyframes screenIn{from{opacity:0;transform:translateY(12px)}}
  .screen.on{animation:screenIn .34s var(--ease)}
  @keyframes cardInR{from{opacity:.35;transform:translateX(30px)}}
  @keyframes cardInL{from{opacity:.35;transform:translateX(-30px)}}
  .card.inR{animation:cardInR .3s var(--ease)}
  .card.inL{animation:cardInL .3s var(--ease)}
  @keyframes starBump{35%{transform:scale(1.28)}}
  .stars.bump{animation:starBump .5s var(--ease)}
  button:focus-visible,.gcell:focus-visible{outline:4px solid #5aabf5;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    .conf{display:none}
    #cheer .box,.screen.on,.card.inR,.card.inL,.stars.bump,.wtile.bad{animation:none}
    *{transition:none!important}
  }
  @media (max-height:620px){
    .hero{margin:1vh 0}
    .big{height:70px;font-size:20px}
  }
  /* よこむき。子どもは平気で端末を回すので、縦組みのまま押し出して
     「できた！」が画面外に消える状態を残さない。左右に分けて全部届くようにする */
  @media (orientation:landscape) and (max-height:560px){
    #app{max-width:none;padding-left:16px;padding-right:16px}
    header{min-height:44px}
    .hbtn{width:44px;height:44px;border-radius:15px;font-size:22px}
    .htitle{font-size:17px}
    .stars{font-size:15px;padding:6px 10px}
    .screen{padding-top:4px}

    .hero{margin:0 0 6px;display:flex;align-items:baseline;justify-content:center;gap:12px}
    .hero .name{font-size:20px;line-height:1.2}
    .hero .name br{display:none}
    .hero .sub{margin-top:0;font-size:13px}
    .novoice{max-width:none;margin-top:6px}
    .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
    .big{height:clamp(54px,26vh,86px);font-size:19px;border-radius:20px;padding:0 14px;gap:10px}
    .big small{font-size:12px}
    .rows{grid-template-columns:repeat(4,1fr)}
    .rowbtn{min-height:72px}

    .dots,#tDots{display:none}
    .stage{flex-direction:row;align-items:stretch;gap:12px}
    .card{flex:1;justify-content:center;padding:10px 14px}
    .card .ch{font-size:min(30vh,22vw)}
    .card .emoji{font-size:min(17vh,12vw)}

<script>
/* =========================================================
   データ：五十音（行ごと）＋ことば＋絵文字
   ========================================================= */
const ROWS = [
  {key:'ao',  label:'あおちゃんの なまえ', special:true, chars:['あ','お']},
  {key:'a',   label:'あ行', chars:['あ','い','う','え','お']},
  {key:'ka',  label:'か行', chars:['か','き','く','け','こ']},
  {key:'sa',  label:'さ行', chars:['さ','し','す','せ','そ']},
  {key:'ta',  label:'た行', chars:['た','ち','つ','て','と']},
  {key:'na',  label:'な行', chars:['な','に','ぬ','ね','の']},
  {key:'ha',  label:'は行', chars:['は','ひ','ふ','へ','ほ']},
  {key:'ma',  label:'ま行', chars:['ま','み','む','め','も']},
  {key:'ya',  label:'や行', chars:['や','ゆ','よ']},
  {key:'ra',  label:'ら行', chars:['ら','り','る','れ','ろ']},
  {key:'wa',  label:'わ行', chars:['わ','を','ん']},
];

const WORDS = {
  'あ':['あり','🐜'], 'い':['いぬ','🐕'], 'う':['うし','🐄'], 'え':['えび','🦐'], 'お':['おにぎり','🍙'],
  'か':['かに','🦀'], 'き':['きのこ','🍄'], 'く':['くま','🐻'], 'け':['けーき','🍰'], 'こ':['こあら','🐨'],
  'さ':['さかな','🐟'], 'し':['しまうま','🦓'], 'す':['すいか','🍉'], 'せ':['せんべい','🍘'], 'そ':['そら','⛅️'],
  'た':['たまご','🥚'], 'ち':['ちょうちょ','🦋'], 'つ':['つき','🌙'], 'て':['て','✋'], 'と':['とまと','🍅'],
  'な':['なす','🍆'], 'に':['にんじん','🥕'], 'ぬ':['ぬいぐるみ','🧸'], 'ね':['ねこ','🐱'], 'の':['のりまき','🍣'],
  'は':['はな','🌸'], 'ひ':['ひつじ','🐑'], 'ふ':['ふね','⛵️'], 'へ':['へび','🐍'], 'ほ':['ほし','⭐️'],
  'ま':['まめ','🫘'], 'み':['みかん','🍊'], 'む':['むし','🐛'], 'め':['め','👁'], 'も':['もも','🍑'],
  'や':['やま','⛰'], 'ゆ':['ゆき','⛄️'], 'よ':['ようふく','👕'],
  'ら':['らいおん','🦁'], 'り':['りんご','🍎'], 'る':['るーぺ','🔍'], 'れ':['れもん','🍋'], 'ろ':['ろけっと','🚀'],
  'わ':['わに','🐊'], 'を':['ほんを よむ','📖'], 'ん':['ぱん','🍞'],
  'が':['がっき','🥁'], 'ぎ':['ぎゅうにゅう','🥛'], 'ぐ':['ぐみ','🍬'], 'げ':['げーむ','🎮'], 'ご':['ごはん','🍚'],
  'ざ':['ざりがに','🦞'], 'じ':['じてんしゃ','🚲'], 'ず':['ずぼん','👖'], 'ぜ':['ぜりー','🍨'], 'ぞ':['ぞう','🐘'],
  'だ':['だんご','🍡'], 'で':['でんしゃ','🚃'], 'ど':['どーなつ','🍩'],
  'ば':['ばなな','🍌'], 'び':['びすけっと','🍪'], 'ぶ':['ぶどう','🍇'], 'べ':['べっど','🛏'], 'ぼ':['ぼーる','⚽️'],
  'ぱ':['ぱんだ','🐼'], 'ぴ':['ぴあの','🎹'], 'ぷ':['ぷりん','🍮'], 'ぺ':['ぺんぎん','🐧'], 'ぽ':['ぽすと','📮'],
};
// ん・を は語頭に来ないので、絵クイズでは末尾/助詞の言い方に切り替える
const TAIL = {'ん':'ぱ__','を':'ほん__ よむ'};

// 身のまわりのことば。1文字ずつ順番になぞって、ことばを書けるようにする。
// 「かく」では行より先に出す（意味のあることばのほうが書きたくなるため）
const WRITE_WORDS = [
  {w:'ぱぱ',     em:'👨'},
  {w:'まま',     em:'👩'},
  {w:'あそぼう', em:'🎈'},
  {w:'だいすき', em:'💗'},
  {w:'ほいくえん', em:'🏫'},
];

// 清音46字のあとに進む濁音・半濁音。ぢ・づ は使う場面がほぼないので入れない
const EXTRA = [
  {key:'ga', label:'が行', chars:['が','ぎ','ぐ','げ','ご'], extra:true},
  {key:'za', label:'ざ行', chars:['ざ','じ','ず','ぜ','ぞ'], extra:true},
  {key:'da', label:'だ行', chars:['だ','で','ど'], extra:true},
  {key:'ba', label:'ば行', chars:['ば','び','ぶ','べ','ぼ'], extra:true},
  {key:'pa', label:'ぱ行', chars:['ぱ','ぴ','ぷ','ぺ','ぽ'], extra:true},
];

const ALL46 = [...new Set(ROWS.slice(1).flatMap(r=>r.chars))];
const ALL = [...new Set([...ALL46,...EXTRA.flatMap(r=>r.chars)])];
const STICKERS = ['🌸','🐰','🍓','⭐️','🦄','🍩','🐬','🌈','🎈','🐥','🍉','🦋','🎀','🐧','🍒','🌻','🐳','🍭','👑','🚀'];

/* =========================================================
   進捗（localStorage）
   ========================================================= */
const APP_VER='14';
const KEY='ao-hiragana-v2';
// 保存領域が使えない環境（プライベートモード等）でも遊べるように失敗を無視する
const store={
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY,JSON.stringify(v)); }catch(e){} },
  del(){ try{ localStorage.removeItem(KEY); }catch(e){} },
};
const D = Object.assign({read:{},wrote:{},stars:0}, store.get());
const save = ()=>store.set(D);
function addStar(n=1){
  D.stars+=n; save(); paintStars();
  // もらった瞬間が分かるように、⭐️をひと跳ねさせる
  starBox.classList.remove('bump'); void starBox.offsetWidth; starBox.classList.add('bump');
}
const paintStars = ()=> starBox.textContent='⭐️ '+D.stars;
const $ = id=>document.getElementById(id);

/* =========================================================
   おと（音声合成）＋ ごきげんな効果音
   ========================================================= */
let jaVoice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices().filter(x=>/ja(-|_)?JP/i.test(x.lang)||/Japanese/i.test(x.name));
  jaVoice = v.find(x=>/Kyoko|O-ren|Otoya|Google/i.test(x.name)) || v[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
const stopSpeech = ()=>{ if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){} };

// 読み上げが実際に鳴ったか（null=まだ分からない / false=鳴らなかった）
let voiceOK=null;
function utter(text,rate){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=rate; u.pitch=1.25; if(jaVoice)u.voice=jaVoice;
  return u;
}
// 読み上げのおおよその長さ。end イベントは端末によって来ないことがあるので、
// 文字数から見積もって「前の声が終わるころ」を計算する
let sayUntil=0;
const estMs=(t,rate)=>250+[...String(t)].length*170/(rate||1);
// 前の読み上げが終わってから実行する（声が重なって途中で切れないように）
const afterSayMs=(gap=180)=>Math.max(0, sayUntil-performance.now())+gap;
const afterSay=(fn,gap)=>setTimeout(fn, afterSayMs(gap));
function say(text,rate=.8){
  sayUntil=performance.now()+estMs(text,rate);
  if(!('speechSynthesis' in window)){ voiceOK=false; noVoiceNotice(); return; }
  try{
    const S=speechSynthesis;
    // 何も喋っていないときに cancel すると、iOSでは次の speak が無視されることがある
    if(S.speaking||S.pending) S.cancel();
    if(S.paused) S.resume();
    const u=utter(text,rate);
    let started=false;
    u.onstart=()=>{ started=true; voiceOK=true; };
    S.speak(u);
    // iOSではまれに無音のまま終わる。鳴っていなければ1回だけ言い直す
    setTimeout(()=>{
      if(started||S.speaking||S.pending) return;
      try{ S.resume(); S.speak(utter(text,rate)); }catch(e){}
      setTimeout(()=>{ if(voiceOK===null){ voiceOK=false; noVoiceNotice(); } },900);
    },350);
  }catch(e){ voiceOK=false; noVoiceNotice(); }
}
// 声が出ないまま黙っていると原因が分からないので、ホームに小さく出す
function noVoiceNotice(){
  const el=$('novoice'); if(el) el.hidden=false;
}
let AC=null;
function beep(freqs,dur=.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*dur;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
    });
  }catch(e){}
}
const sndOK  = ()=>beep([784,988,1319]);
const sndNG  = ()=>beep([330,247],.16);
const sndTap = ()=>beep([880],.06);

/* =========================================================
   画面遷移
   ========================================================= */
const SCREENS={home:'s-home',rows:'s-rows',read:'s-read',trace:'s-trace',quizmenu:'s-quizmenu',quiz:'s-quiz',build:'s-build',reward:'s-reward'};
let stack=[];
function show(name,title,push=true){
  Object.values(SCREENS).forEach(id=>$(id).classList.remove('on'));
  $(SCREENS[name]).classList.add('on');
  // ホームには大きな見出しがあるので、ヘッダーの題は出さない（同じ言葉が二重に出るため）
  $('title').textContent = name==='home' ? '' : (title||'ひらがな');
  if(push)stack.push(name);
  $('back').style.visibility = name==='home' ? 'hidden':'visible';
}
$('back').onclick=()=>{
  sndTap(); stopSpeech();
  stack.pop(); const prev=stack.pop()||'home';
  if(prev==='home') goHome();
  else if(prev==='rows') openRows(rowsMode);
  else if(prev==='quizmenu') show('quizmenu','クイズ');
  else goHome();
};
function goHome(){ stack=[]; show('home','ひらがな'); }

// ボタンは押したら必ず名前を読み上げる（まだ字が読めなくても、どこにいるか音でわかるように）
// iOSは「指で押した瞬間」に呼ばれた speak しか鳴らさない。
// setTimeout をはさむと無音になるので、ここでは必ず同期で読み上げる。
function tap(b){
  if(b&&b.dataset.say) say(b.dataset.say,.85);
  sndTap();
}

document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
  tap(b);
  const g=b.dataset.go;
  if(g==='rows-read') openRows('read');
  else if(g==='rows-trace') openRows('trace');
  else if(g==='quiz-menu') show('quizmenu','クイズ');
  else if(g==='reward') openReward();
});

/* =========================================================
   行えらび
   ========================================================= */
let rowsMode='read';
function openRows(mode){
  rowsMode=mode;
  const list=$('rowList'); list.innerHTML=''; list.className='rows '+mode;
  // 清音46字が半分以上読めてから濁音を出す（最初から選択肢が多すぎないように）
  const readCount=ALL46.filter(c=>D.read[c]).length;
  let rows = readCount>=23 ? [...ROWS,...EXTRA] : ROWS;
  // 「かく」では、身のまわりのことばを行より先に置く
  if(mode==='trace'){
    rows = [...WRITE_WORDS.map(x=>({key:'w-'+x.w, chars:[...x.w], word:x.w, em:x.em})), ...rows];
  }
  rows.forEach(r=>{
    const done=r.chars.filter(c=>mode==='read'?D.read[c]:D.wrote[c]).length;
    const b=document.createElement('button');
    b.className='rowbtn'+(done===r.chars.length?' done':'')+(r.special?' special':'')+(r.extra?' extra':'')+(r.word?' word':'');
    // 進みぐあいは算用数字ではなく●で見せる（4歳は「0 / 5」を読めない）
    const prog = r.special
      ? '<span class="lbl">あおちゃん 💗</span>'
      : r.chars.map((_,i)=>`<i class="${i<done?'on':''}"></i>`).join('');
    b.innerHTML=(r.em?`<div class="em">${r.em}</div>`:'')
      +`<div class="chars">${r.chars.join('')}</div><div class="prog">${prog}</div>`;
    b.dataset.say = r.word ? r.word : (r.special ? 'あおちゃん' : r.chars.join('、'));
    b.onclick=()=>{ tap(b); mode==='read'?openRead(r):openTrace(r); };
    list.appendChild(b);
  });
  show('rows', mode==='read'?'どれを よむ？':'どれを かく？');
}

/* =========================================================
   よむ
   ========================================================= */
let rSet=[], rIdx=0, rSpecial=false;
// 画面を離れたあとに、あとから来る処理が割り込まないようにする
const stillOn = id => $(id).classList.contains('on');
// 「お祝い → つぎへ」の流れは、始まったら終わるまで受け付けない。
// 4歳はボタンを連打する。ガードが無いと⭐️が3倍に入り、画面も2枚3枚と飛ぶ
let locked=false;
function lockFor(ms, then){
  if(locked) return false;
  locked=true;
  setTimeout(()=>{ locked=false; then&&then(); }, ms);
  return true;
}
function openRead(row){
  rSet=row.chars.slice(); rIdx=0; rSpecial=!!row.special;
  // 行の名前を読み終わってから1枚目を読む（声が重ならないように）
  show('read','よむ'); paintRead('after');
}
let readTimer=0;
function paintRead(lead=0, dir=0){
  const c=rSet[rIdx];
  // 名前の行だけは「あり・おにぎり」ではなく、自分の名前で見せる
  const [w,em] = rSpecial ? ['あおちゃん','💗'] : WORDS[c];
  $('rCh').textContent=c;
  $('rEm').textContent=em;
  $('rWord').innerHTML = w.includes(c) ? w.replace(c,`<b>${c}</b>`) : `<b>${c}</b>…${w}`;
  $('rPrev').disabled = rIdx===0;
  // 最後のカードでは「▶︎」を「🎉」に変えて、ここで終わりだと分かるようにする
  const last = rIdx===rSet.length-1;
  $('rNext').disabled = false;
  $('rNext').textContent = last ? '🎉' : '▶︎';
  $('readDots').innerHTML = rSet.map((_,i)=>`<div class="dot${i===rIdx?' on':''}"></div>`).join('');
  // 「開いた瞬間」に⭐️を渡すと、▶を連打するだけで46字ぶんが数秒で貯まってしまう。
  // カードがしばらく開かれていたら「よんだ」とみなす（ふつうに遊ぶぶんには気づかない）
  clearTimeout(readTimer);
  if(!D.read[c]) readTimer=setTimeout(()=>{
    if(!stillOn('s-read')||rSet[rIdx]!==c) return;
    D.read[c]=true; save(); addStar(1);
  },1200);
  if(dir){
    const el=$('readCard');
    el.classList.remove('inR','inL'); void el.offsetWidth;
    el.classList.add(dir>0?'inR':'inL');
  }
  const line=`${c}。${w}`;
  if(lead==='after') afterSay(()=>{ if(stillOn('s-read')&&rSet[rIdx]===c) say(line); });
  else say(line);
}
const rWordNow = ()=> rSpecial ? 'あおちゃん' : WORDS[rSet[rIdx]][0];
$('rSay').onclick=()=>say(`${rSet[rIdx]}。${rWordNow()}`);
$('rCh').onclick=()=>say(rSet[rIdx],.6);
$('rEm').onclick=()=>say(rWordNow());
$('rPrev').onclick=()=>{ if(locked) return; if(rIdx>0){rIdx--;sndTap();paintRead(0,-1);} };
$('rNext').onclick=()=>{ if(locked) return; if(rIdx<rSet.length-1){rIdx++;sndTap();paintRead(0,1);} else finishSet(); };
function finishSet(){
  // お祝いが終わるまで次を受け付けない（連打しても⭐️は1回ぶん）
  if(!lockFor(1600, ()=>{ if(stillOn('s-read')) openRows('read'); })) return;
  $('rNext').disabled=true;
  cheer('🎉','ぜんぶ よめた！'); addStar(2); say('ぜんぶ よめたね');
}

/* =========================================================
   なぞりがき
   - 見本グリフをマスク化し、指の軌跡がどれだけ重なったかで判定
   ========================================================= */
const guide=$('guide'), draw=$('draw');
const gctx=guide.getContext('2d'), dctx=draw.getContext('2d',{willReadFrequently:true});
let tSet=[], tIdx=0, DPR=1, SZ=340, maskData=null, maskTotal=0, drawing=false;
const CELL=8; let GW=1, lastW=0;

function sizeCanvas(){
  const box=draw.getBoundingClientRect();
  lastW = Math.round(box.width);        // 実測値そのもの（0のこともある）
  SZ = lastW || 340;
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  [guide,draw].forEach(cv=>{ cv.width=SZ*DPR; cv.height=SZ*DPR; });
  gctx.setTransform(DPR,0,0,DPR,0,0);
  dctx.setTransform(DPR,0,0,DPR,0,0);
}
let tWord='';
function openTrace(row){
  tSet=row.chars.slice(); tIdx=0; tWord=row.word||'';
  show('trace', tWord||'かく');
  requestAnimationFrame(()=>{ sizeCanvas(); paintTrace('after'); });
}
/* ---- 書き順（KanjiVG の線データ。1画ずつ、書く順に入っている）---- */
const KBOX=109, KPAD=0.07;
const NUM=['いち','に','さん','よん','ご','ろく'];
let kMeasure=null;
function measurePath(d){                      // 線の長さ・途中の点を測るための隠しSVG
  if(!kMeasure){
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.style.cssText='position:absolute;left:-9999px;top:0;width:0;height:0';
    kMeasure=document.createElementNS(ns,'path');
    svg.appendChild(kMeasure); document.body.appendChild(svg);
  }
  kMeasure.setAttribute('d',d); return kMeasure;
}
const strokesOf = c => (typeof STROKES!=='undefined' && STROKES[c]) ? STROKES[c] : null;
const kScale = () => SZ*(1-2*KPAD)/KBOX;
function kEnter(ctx){ ctx.save(); ctx.translate(SZ*KPAD,SZ*KPAD); ctx.scale(kScale(),kScale()); ctx.lineJoin='round'; ctx.lineCap='round'; }
const kPoint = (x,y) => [SZ*KPAD+x*kScale(), SZ*KPAD+y*kScale()];
function kStart(d){ const m=/^[Mm]\s*(-?[\d.]+)[ ,]\s*(-?[\d.]+)/.exec(d); return m?[+m[1],+m[2]]:[0,0]; }

// 下地：白＋十字ガイド＋うすい見本＋画数の番号
function paintGuide(){
  const c=tSet[tIdx], st=strokesOf(c);
  gctx.clearRect(0,0,SZ,SZ);
  gctx.fillStyle='#fff'; gctx.fillRect(0,0,SZ,SZ);
  gctx.strokeStyle='#f0e6ec'; gctx.lineWidth=2; gctx.setLineDash([7,9]);
  gctx.beginPath();
  gctx.moveTo(SZ/2,14); gctx.lineTo(SZ/2,SZ-14);
  gctx.moveTo(14,SZ/2); gctx.lineTo(SZ-14,SZ/2);
  gctx.stroke(); gctx.setLineDash([]);
  if(st){
    kEnter(gctx);
    gctx.strokeStyle='#f3d9e4'; gctx.lineWidth=7;
    st.forEach(d=>gctx.stroke(new Path2D(d)));
    gctx.restore();
    // どこから書き始めるかを数字で示す
    const r=Math.max(9,SZ*0.038);
    st.forEach((d,i)=>{
      const [x,y]=kPoint(...kStart(d));
      gctx.beginPath(); gctx.arc(x,y,r,0,7);
      gctx.fillStyle='#ffe6b8'; gctx.fill();
      gctx.fillStyle='#c56a12'; gctx.font='700 '+Math.round(r*1.3)+'px sans-serif';
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.fillText(String(i+1),x,y+1);
    });
  }else{
    gctx.font=Math.round(SZ*0.78)+'px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
    gctx.textAlign='center'; gctx.textBaseline='middle';
    gctx.fillStyle='#f3d9e4'; gctx.fillText(c,SZ/2,SZ/2+SZ*0.03);
  }
}

// 書き順のアニメーション。1画ずつ、番号を声に出しながらなぞって見せる
let animId=0;
function stopOrder(){ if(animId){ cancelAnimationFrame(animId); animId=0; } }
function playOrder(voice){
  const c=tSet[tIdx], st=strokesOf(c);
  if(!st) return;
  stopOrder();
  const lens=st.map(d=>measurePath(d).getTotalLength());
  const dur=lens.map(L=>Math.max(450,L*13));
  let i=0, t0=performance.now(), spoke=-1;
  const step=(t)=>{
    if(!$('s-trace').classList.contains('on')||tSet[tIdx]!==c){ animId=0; return; }
    const p=Math.min(1,Math.max(0,(t-t0)/dur[i]));
    if(voice&&spoke!==i&&p>0){ spoke=i; say(NUM[i]||String(i+1),.9); }
    paintGuide();
    kEnter(gctx);
    gctx.lineWidth=7;
    gctx.strokeStyle='#ffb3cd';
    for(let k=0;k<i;k++) gctx.stroke(new Path2D(st[k]));
    gctx.strokeStyle='#e0407a';
    gctx.setLineDash([lens[i]*p, lens[i]]); gctx.stroke(new Path2D(st[i])); gctx.setLineDash([]);
    gctx.restore();
    const pt=measurePath(st[i]).getPointAtLength(lens[i]*p);
    const [px,py]=kPoint(pt.x,pt.y);
    gctx.beginPath(); gctx.arc(px,py,Math.max(7,SZ*0.03),0,7);
    gctx.fillStyle='#e0407a'; gctx.fill();
    if(p>=1){
      i++; t0=t+200;                       // 次の画まで少し間をおく
      if(i>=st.length){ animId=0; setTimeout(()=>{ if(tSet[tIdx]===c) paintGuide(); },600); return; }
    }
    animId=requestAnimationFrame(step);
  };
  animId=requestAnimationFrame(step);
}
$('tOrder').onclick=()=>{ sndTap(); playOrder(true); };

function paintTrace(lead=0){
  const c=tSet[tIdx];
  stopOrder();
  // 何の字かは見本が、何文字目かは●が、ことばはヘッダーが見せている。
  // ここで全部を言い直すと、狭い端末で2行に割れて見本が縮む
  $('tHint').textContent = 'ゆびで なぞろう！';
  $('tOrder').hidden = !strokesOf(c);
  // 行やことばの何文字目にいるか。よむ側と同じ見せ方に揃える
  $('tDots').innerHTML = tSet.length>1
    ? tSet.map((_,i)=>`<div class="dot${i===tIdx?' on':''}"></div>`).join('') : '';
  if(lead!==false){
    const line = tWord ? `${tWord}の、${c}` : `${c}を なぞってね`;
    const at = lead==='after' ? afterSayMs() : 250;
    setTimeout(()=>{
      if(!stillOn('s-trace')||tSet[tIdx]!==c) return;
      say(line,.7);
      // 言い終わってから、書き順をひととおり見せる
      afterSay(()=>{ if(stillOn('s-trace')&&tSet[tIdx]===c&&!strokes) playOrder(true); },300);
    }, at);
  }
  paintGuide();
  // 判定マスク（見本を太らせた領域）
  const m=document.createElement('canvas'); m.width=SZ; m.height=SZ;
  const mc=m.getContext('2d',{willReadFrequently:true});
  const st=strokesOf(c);
  mc.lineJoin='round'; mc.lineCap='round';
  mc.strokeStyle='#000'; mc.fillStyle='#000';
  if(st){
    mc.save(); mc.translate(SZ*KPAD,SZ*KPAD); mc.scale(kScale(),kScale());
    mc.lineJoin='round'; mc.lineCap='round'; mc.lineWidth=11;
    st.forEach(d=>mc.stroke(new Path2D(d)));
    mc.restore();
  }else{
    mc.font=Math.round(SZ*0.78)+'px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
    mc.textAlign='center'; mc.textBaseline='middle';
    mc.lineWidth=Math.max(18,SZ*0.075);
    mc.strokeText(c,SZ/2,SZ/2+SZ*0.03); mc.fillText(c,SZ/2,SZ/2+SZ*0.03);
  }
  const d=mc.getImageData(0,0,SZ,SZ).data;
  // 判定は CELL px 角のマスで行う（指の太さと相性がよく、計算も軽い）
  GW=Math.ceil(SZ/CELL);
  maskData=new Uint8Array(GW*GW); maskTotal=0;
  for(let y=0;y<SZ;y++){
    const gy=(y/CELL)|0;
    for(let x=0;x<SZ;x++){
      if(d[(y*SZ+x)*4+3]>40){
        const i=gy*GW+((x/CELL)|0);
        if(!maskData[i]){ maskData[i]=1; maskTotal++; }
      }
    }
  }
  clearDraw();
}
function clearDraw(){
  dctx.clearRect(0,0,SZ,SZ);
  covered=new Uint8Array(GW*GW); strokes=0;
}
let covered=new Uint8Array(0), strokes=0, last=null;
function pos(e){
  const r=draw.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left), y:(t.clientY-r.top)};
}
function ink(a,b){
  dctx.strokeStyle='#ff7fae'; dctx.lineCap='round'; dctx.lineJoin='round';
  dctx.lineWidth=Math.max(16,SZ*0.062);
  dctx.beginPath(); dctx.moveTo(a.x,a.y); dctx.lineTo(b.x,b.y); dctx.stroke();
  // 進捗記録：線分上をサンプリングし、ブラシ半径内のマスを塗ったことにする
  if(!maskData)return;
  const R=Math.max(10,SZ*0.038), rc=Math.ceil(R/CELL);
  const steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/(CELL/2)));
  for(let s=0;s<=steps;s++){
    const gx=((a.x+(b.x-a.x)*s/steps)/CELL)|0, gy=((a.y+(b.y-a.y)*s/steps)/CELL)|0;
    for(let dy=-rc;dy<=rc;dy++)for(let dx=-rc;dx<=rc;dx++){
      if(dx*dx+dy*dy>rc*rc)continue;
      const x=gx+dx, y=gy+dy;
      if(x<0||y<0||x>=GW||y>=GW)continue;
      const i=y*GW+x;
      if(maskData[i]) covered[i]=1;
    }
  }
}
function startDraw(e){ e.preventDefault(); if(animId){ stopOrder(); paintGuide(); } drawing=true; strokes++; last=pos(e); ink(last,{x:last.x+.1,y:last.y}); }
function moveDraw(e){ if(!drawing)return; e.preventDefault(); const p=pos(e); ink(last,p); last=p; }
function endDraw(e){ if(drawing){e&&e.preventDefault();} drawing=false; }
draw.addEventListener('touchstart',startDraw,{passive:false});
draw.addEventListener('touchmove',moveDraw,{passive:false});
draw.addEventListener('touchend',endDraw,{passive:false});
draw.addEventListener('touchcancel',endDraw,{passive:false});
draw.addEventListener('mousedown',startDraw);
draw.addEventListener('mousemove',moveDraw);
window.addEventListener('mouseup',endDraw);
// iOSはアドレスバーの開閉だけでもresizeが飛ぶ。幅が実際に変わった時だけ描き直す
// （そうしないと、なぞっている最中に子どもの線が消えてしまう）
window.addEventListener('resize',()=>{
  if(!$('s-trace').classList.contains('on'))return;
  const w=Math.round(draw.getBoundingClientRect().width);
  if(!w || w===lastW)return;           // 幅が変わっていなければ描いた線を残す
  sizeCanvas(); paintTrace(false);      // 描き直しでは読み上げない
});

$('tClear').onclick=()=>{ if(locked) return; sndTap(); clearDraw(); $('tHint').textContent='もういちど どうぞ！'; };
$('tCheck').onclick=()=>{
  if(!maskTotal || locked) return;
  let hit=0; for(let i=0;i<covered.length;i++) if(covered[i])hit++;
  const ratio = hit/maskTotal;              // 見本をどれだけ塗れたか
  const c=tSet[tIdx];
  if(ratio>=0.55 && strokes>0){
    if(!lockFor(1500, ()=>{ if(stillOn('s-trace')) nextTrace(); })) return;
    if(!D.wrote[c]){ D.wrote[c]=true; save(); }
    addStar(2); sndOK(); say(`${c}、じょうずだね`);
    cheer(ratio>0.8?'💯':'🌟', ratio>0.8?'かんぺき！':'よくできた！');
  }else if(ratio>=0.3){
    sndNG(); $('tHint').textContent='あと ちょっと！ぜんぶ なぞってみて 💪';
    say('あとちょっと');
  }else{
    sndNG(); $('tHint').textContent='うすい もじの うえを なぞってね ✏️';
    say('うすいもじの うえを なぞってね');
  }
};
$('tNext').onclick=()=>{ if(locked) return; sndTap(); nextTrace(); };
function nextTrace(){
  if(tIdx<tSet.length-1){ tIdx++; paintTrace(); return; }
  if(!lockFor(1900, ()=>{ if(stillOn('s-trace')) openRows('trace'); })) return;
  if(tWord){ cheer('🏆','「'+tWord+'」が かけた！'); setTimeout(()=>{ if(stillOn('s-trace')) say(tWord+'が かけたね'); },300); }
  else cheer('🏆','ぜんぶ かけた！');
  addStar(3);
}

/* =========================================================
   クイズ（3種）
   ========================================================= */
let qMode='listen', qN=0, qTotal=8, qLog=[], qAns='';
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function learned(){ const l=ALL.filter(c=>D.read[c]); return l.length>=4?l:ALL.slice(0,10); }

document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{ tap(b); startQuiz(b.dataset.quiz); });
// 1問目は、押したボタンの名前を読み終わってから出題する（声が重ならないように）
let qLead=260;
function startQuiz(mode){
  qMode=mode; qN=0; qLog=[]; qLead='after';
  show('quiz','クイズ'); nextQ();
}
function paintBar(){
  $('qBar').innerHTML = Array.from({length:qTotal},(_,i)=>
    `<i class="${qLog[i]===1?'hit':qLog[i]===0?'miss':i===qN?'now':''}"></i>`).join('');
}
function nextQ(){
  if(qN>=qTotal) return endQuiz();
  paintBar();
  const pool=learned();
  qAns=pick(pool);
  let wrong=shuffle(pool.filter(c=>c!==qAns)).slice(0,3);
  while(wrong.length<3){ const c=pick(ALL); if(c!==qAns&&!wrong.includes(c))wrong.push(c); }
  const opts=shuffle([qAns,...wrong]);
  const top=$('qTop'), ch=$('qChoices');
  const lead = qLead==='after' ? afterSayMs() : qLead; qLead=260;

  if(qMode==='listen'){
    top.innerHTML=`<div class="qem" id="qPlay">🔊</div><div class="qtxt">どの もじ？（おして もういちど）</div>`;
    setTimeout(()=>say(qAns,.55),lead);
    $('qPlay').onclick=()=>say(qAns,.55);
    ch.innerHTML=opts.map(c=>`<button class="choice" data-c="${c}">${c}</button>`).join('');
  }else if(qMode==='picture'){
    const [w,em]=WORDS[qAns];
    const shown = TAIL[qAns] ? TAIL[qAns] : '__'+w.slice(1);
    top.innerHTML=`<button class="replay" aria-label="もういちど きく">🔊</button>`
      +`<div class="qem">${em}</div><div class="qtxt">${shown}　→　どの もじ？</div>`;
    setTimeout(()=>say(w),lead);
    top.onclick=()=>say(w);
    ch.innerHTML=opts.map(c=>`<button class="choice" data-c="${c}">${c}</button>`).join('');
  }else{ // reverse：文字を見て、正しい絵をえらぶ
    top.innerHTML=`<button class="replay" aria-label="もういちど きく">🔊</button>`
      +`<div class="qch">${qAns}</div><div class="qtxt">この もじの ことばは どれ？</div>`;
    setTimeout(()=>say(qAns,.55),lead);
    top.onclick=()=>say(qAns,.55);
    // 絵が答えなので、絵はカードいっぱいの大きさで出す
    ch.innerHTML=opts.map(c=>`<button class="choice em" data-c="${c}">${WORDS[c][1]}</button>`).join('');
  }
  ch.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));
}
function answer(btn){
  const ok = btn.dataset.c===qAns;
  $('qChoices').querySelectorAll('.choice').forEach(b=>b.onclick=null);
  if(ok){
    btn.classList.add('ok'); sndOK(); addStar(1); qLog[qN]=1;
    say(qMode==='reverse'?WORDS[qAns][0]:`${qAns}、せいかい`);
  }else{
    btn.classList.add('ng'); sndNG(); qLog[qN]=0;
    const right=$('qChoices').querySelector(`[data-c="${qAns}"]`);
    right&&right.classList.add('ok');
    say(qMode==='reverse'?`こたえは ${WORDS[qAns][0]}`:`こたえは ${qAns}`);
  }
  qN++; paintBar();
  setTimeout(()=>{ if(stillOn('s-quiz')) nextQ(); }, ok?1000:1900);
}
function endQuiz(){
  const hit=qLog.filter(x=>x===1).length;
  addStar(hit>=7?5:hit>=5?3:1);
  cheer(hit>=7?'🏆':hit>=5?'😄':'💪', `${qTotal}もん中 ${hit}もん せいかい！`);
  setTimeout(()=>{ if(stillOn('s-quiz')) show('quizmenu','クイズ'); },2200);
}

/* =========================================================
   ことばづくり：絵と音をたよりに、もじを順番どおりに並べる
   ========================================================= */
// ならべ替えに使えることば（2〜3文字、伸ばす音「ー」を含まないもの）
const BUILDABLE = [...new Set([
    ...Object.values(WORDS).map(v=>v[0]).filter(w=>/^[ぁ-ん]{2,3}$/.test(w)),
    ...WRITE_WORDS.map(x=>x.w),
  ])];
// ことば→絵文字（WORDS と みのまわりのことば の両方から引く）
const WORD_EM = Object.fromEntries([
  ...Object.values(WORDS).map(v=>[v[0],v[1]]),
  ...WRITE_WORDS.map(x=>[x.w,x.em]),
]);
let bWord='', bPos=0, bN=0, bTotal=6, bLog=[];

$('goBuild').onclick=()=>{ tap($('goBuild')); bN=0; bLog=[]; show('build','ことばづくり'); nextBuild(); };

function nextBuild(){
  if(bN>=bTotal) return endBuild();
  $('bBar').innerHTML=Array.from({length:bTotal},(_,i)=>
    `<i class="${bLog[i]===1?'hit':bLog[i]===0?'miss':i===bN?'now':''}"></i>`).join('');
  // 読んだ文字だけでできることばを優先し、足りなければ全体から出す
  const known=BUILDABLE.filter(w=>[...w].every(c=>D.read[c]));
  // まだ読んだ文字が少ないうちは、濁音を含まない清音のことばに限る
  bWord=pick(known.length>=3 ? known
    : BUILDABLE.filter(w=>[...w].every(c=>ALL46.includes(c))));
  bPos=0;
  $('bEm').textContent=WORD_EM[bWord]||'🧩';
  $('bTxt').textContent='「'+bWord+'」を つくろう';
  $('bEm').onclick=()=>say(bWord);
  $('bRep').onclick=()=>say(bWord);
  setTimeout(()=>{ if(stillOn('s-build')) say(bWord); }, bN===0?afterSayMs():300);   // 1問目はボタン名を読み終えてから
  $('bSlots').className='wslots'+(bWord.length>=4?' long':'');
  $('bSlots').innerHTML=[...bWord].map(()=>`<div class="wslot"></div>`).join('');
  // 正解の文字＋おとり1枚をまぜる。おとりも、その子が知っている字から出す
  const dpool=learned().filter(c=>!bWord.includes(c));
  const decoy=pick(dpool.length?dpool:ALL.filter(c=>!bWord.includes(c)));
  $('bTiles').innerHTML=shuffle([...bWord,decoy])
    .map(c=>`<button class="wtile" data-c="${c}">${c}</button>`).join('');
  $('bTiles').querySelectorAll('.wtile').forEach(t=>t.onclick=()=>tapTile(t));
}
function tapTile(t){
  const want=bWord[bPos];
  if(t.dataset.c===want){
    const slot=$('bSlots').children[bPos];
    slot.textContent=want; slot.classList.add('filled');
    t.classList.add('used'); t.onclick=null;
    bPos++; sndTap(); say(want,.6);
    if(bPos===bWord.length){
      bLog[bN]=bLog[bN]===0?0:1;          // 途中で間違えた回は不正解のまま
      if(bLog[bN]===1) addStar(2);
      sndOK(); setTimeout(()=>say(bWord),350);
      cheer('🧩','「'+bWord+'」できた！');
      bN++; setTimeout(()=>{ if(stillOn('s-build')) nextBuild(); },1800);
    }
  }else{
    bLog[bN]=0;
    t.classList.add('bad'); sndNG();
    say('つぎは '+want);
    setTimeout(()=>t.classList.remove('bad'),400);
  }
}
function endBuild(){
  const hit=bLog.filter(x=>x===1).length;
  addStar(hit>=5?4:2);
  cheer(hit>=5?'🏆':'💪',`${bTotal}こ中 ${hit}こ せいかい！`);
  setTimeout(()=>{ if(stillOn('s-build')) show('quizmenu','クイズ'); },2200);
}

/* =========================================================
   ごほうび
   ========================================================= */
function openReward(){
  const got=Math.min(STICKERS.length, Math.floor(D.stars/5));
  $('rewardCount').innerHTML=`あつめた ⭐️ ${D.stars}こ<span class="rsub">⭐️5こで シールが1まい もらえるよ</span>`;
  // まだ手に入っていないシールも影で見せる。あと何枚かが見えることが集める動機になる
  $('sheet').innerHTML=STICKERS.map((s,i)=>`<div class="slot${i<got?' got':''}">${s}</div>`).join('');
  const g=$('gojuon'); g.innerHTML='<div class="gsub">あいうえお ひょう</div>';
  const table=(rows)=>rows.forEach(r=>{
    const cells=r.chars.slice();
    while(cells.length<5)cells.push(null);
    cells.forEach(c=>{
      const d=document.createElement('div');
      if(!c){ d.className='gcell blank'; }
      else{
        d.className='gcell'+(D.read[c]?' read':'')+(D.wrote[c]?' wrote':'');
        d.textContent=c;
        d.onclick=()=>say(c,.6);
      }
      g.appendChild(d);
    });
  });
  table(ROWS.slice(1));
  if(EXTRA.some(r=>r.chars.some(c=>D.read[c]))){
    const h=document.createElement('div');
    h.className='gsub'; h.textContent='てんてん・まる';
    g.appendChild(h);
    table(EXTRA);
  }
  show('reward','ごほうび');
}

/* =========================================================
   お祝い演出
   ========================================================= */
function cheer(em,msg){
  $('cheerEm').textContent=em; $('cheerMsg').textContent=msg;
  $('cheer').classList.add('on');
  for(let i=0;i<18;i++){
    const c=document.createElement('div');
    c.className='conf'; c.textContent=pick(['🎉','⭐️','🌸','💗','✨','🎈']);
    c.style.left=Math.random()*96+'vw';
    c.style.animationDuration=(1.1+Math.random()*1.1)+'s';
    c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2600);
  }
  setTimeout(()=>$('cheer').classList.remove('on'),1500);
}
$('cheer').onclick=()=>$('cheer').classList.remove('on');

/* =========================================================
   スマホ用の細かい調整
   ========================================================= */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',()=>{ if(AC&&AC.state==='suspended')AC.resume(); },{once:true});
// 最初のタップで音声を起こす（iOS対策）
document.addEventListener('touchend',()=>{ if(jaVoice===null&&'speechSynthesis' in window)pickVoice(); },{once:true});
// 保護者用：⭐️を2秒 長押しで さいしょから
(()=>{
  let t=null;
  const start=()=>{ t=setTimeout(()=>{
    // 2秒押しは4歳でも起こせるし、はい／いいえは読めないまま押せてしまう。
    // 足し算を1問はさんで、消せるのが大人だけになるようにする
    const a=3+Math.floor(Math.random()*7), b=3+Math.floor(Math.random()*7);
    const ans=prompt(`きろく（⭐️とシール）を ぜんぶ けしますか？\nけす場合は ${a} + ${b} の こたえを 入力してください。`);
    if(ans!==null && Number(String(ans).trim())===a+b){
      store.del();
      D.read={}; D.wrote={}; D.stars=0; paintStars(); goHome();
    }
  },2000); };
  const stop=()=>{ clearTimeout(t); t=null; };
  ['touchstart','mousedown'].forEach(e=>starBox.addEventListener(e,start));
  ['touchend','touchcancel','touchmove','mouseup','mouseleave'].forEach(e=>starBox.addEventListener(e,stop));
})();
// オフラインで遊べるようにする。file:// や sw.js を置けない環境では何もしない
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
paintStars();

/* =========================================================
   保護者向け：おとの確認と、版の入れ替え
   ========================================================= */
$('verLabel').textContent='v'+APP_VER;
$('sndTest').onclick=()=>{
  const msg=$('sndMsg');
  msg.textContent=' ためしています…';
  voiceOK=null;
  if(!('speechSynthesis' in window)){ msg.textContent=' ⚠️ この ブラウザは 読み上げに 対応していません'; return; }
  const u=utter('おとの テスト。きこえますか',.85);
  let started=false;
  u.onstart=()=>{ started=true; voiceOK=true; msg.textContent=' ✅ 読み上げは でています'; };
  u.onerror=e=>{ if(!started) msg.textContent=' ⚠️ 読み上げが とまりました（'+(e.error||'')+'）'; };
  try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){}
  setTimeout(()=>{
    if(started) return;
    // 受け付けられて「喋っている」状態なら、音量やマナーモードの問題の可能性が高い
    if(speechSynthesis.speaking||speechSynthesis.pending){
      msg.innerHTML=' ⚠️ 読み上げは うけつけられましたが、鳴りはじめた合図が ありません。'
        +'<br>マナーモードの かいじょ と 音量を ご確認ください';
      return;
    }
    msg.innerHTML=' ⚠️ 読み上げが 鳴りません。<br>マナーモードの かいじょ／音量／'
      +'設定→アクセシビリティ→読み上げコンテンツ の 日本語音声 を ご確認ください'
      +'<br>（にほんごの こえ：'+(jaVoice?jaVoice.name:'みつかりません')+'）';
  },1500);
};

// 新しい版が出ていたら、その場で入れ替える（ホーム画面アプリが古いままにならないように）。
// キャッシュを先に消すと、その直後に電波が切れたとき遊べなくなる。
// まずサービスワーカーに新しい版を取り込ませ、それが終わってから読み直す。
if(location.protocol.startsWith('http')){
  fetch('index.html?fresh=1&t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject())
    .then(t=>{
      const m=/APP_VER='(\d+)'/.exec(t);
      // 同じ版で読み直しを繰り返さないための印。版ごとに持つ
      // （'1'固定にすると、同じセッション中の2回目の更新を取りこぼす）
      if(!m || m[1]===APP_VER || sessionStorage.getItem('ao-upd')===m[1]) return;
      sessionStorage.setItem('ao-upd',m[1]);
      let done=false;
      const reload=()=>{ if(!done){ done=true; location.reload(); } };
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(!reg) return reload();
        reg.addEventListener('updatefound',()=>{
          const sw=reg.installing;
          sw&&sw.addEventListener('statechange',()=>{ if(sw.state==='activated') reload(); });
        });
        reg.update().catch(()=>{});
        // 取り込みが始まらないときの保険（この時点で通信はできている）
        setTimeout(()=>{ if(!done) caches.keys()
          .then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{}).then(reload); },6000);
      }).catch(reload);
    })
    .catch(()=>{});
}
